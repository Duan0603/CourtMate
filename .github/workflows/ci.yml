name: CourtMate CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/backend/package-lock.json

      - name: Install & Build Shared Package
        run: |
          npm install --prefix packages/shared
          npm run build --prefix packages/shared

      - name: Install Backend Dependencies
        run: npm ci --prefix apps/backend

      - name: Install Web Dependencies
        run: npm ci --prefix apps/web

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Build Backend App
        run: npm run build --prefix apps/backend

      - name: Build Web App
        run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '85275426952-vgg294ip0cmnh08t9ekchk12lk1p0eee.apps.googleusercontent.com' }}
