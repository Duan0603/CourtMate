name: CourtMate CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json

      - name: Install Shared Dependencies
        run: npm install --prefix packages/shared

      - name: Install Backend Dependencies
        run: npm ci --prefix apps/backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix apps/frontend

      - name: Build Shared Package
        run: npm run build --prefix packages/shared

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Build Backend App
        run: npm run build --prefix apps/backend

      - name: Verify Frontend App
        run: npm run typecheck --prefix apps/frontend
